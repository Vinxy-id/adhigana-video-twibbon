<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="twibbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#twibbonBg)" filter="url(#shadow)"/>
  
  <!-- Outer Subtle Tech Ring -->
  <circle cx="32" cy="32" r="23" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>
  
  <!-- Segmented Twibbon Aperture Ring -->
  <circle cx="32" cy="32" r="19" stroke="url(#ringGlow)" stroke-width="3" stroke-dasharray="24 6 12 6" fill="none"/>
  
  <!-- Inner Circle Frame Fill -->
  <circle cx="32" cy="32" r="14" fill="#0b0c10" fill-opacity="0.5"/>
  
  <!-- Centered Play / Media Symbol -->
  <path d="M28 22.5L41.5 32L28 41.5V22.5Z" fill="#ffffff"/>

  <!-- Accent Status Indicator (Top Right) -->
  <circle cx="49" cy="15" r="3.5" fill="#22c55e" stroke="#ffffff" stroke-width="1"/>
</svg>
